apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ecommerce-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: ecommerce/order:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_PATH
              value: "/data/order.db"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog:8000"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory:8000"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment:8000"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ecommerce-demo
spec:
  selector:
    app: order
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
