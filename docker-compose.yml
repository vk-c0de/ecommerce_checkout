services:
  catalog:
    build: ./services/catalog
    container_name: ecommerce-catalog
    ports:
      - "8001:8000"
    environment:
      SERVICE_PORT: "8000"
      DATABASE_PATH: "/data/catalog.db"
    volumes:
      - ./data/catalog:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  inventory:
    build: ./services/inventory
    container_name: ecommerce-inventory
    ports:
      - "8002:8000"
    environment:
      SERVICE_PORT: "8000"
      DATABASE_PATH: "/data/inventory.db"
    volumes:
      - ./data/inventory:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  payment:
    build: ./services/payment
    container_name: ecommerce-payment
    ports:
      - "8004:8000"
    environment:
      SERVICE_PORT: "8000"
      DATABASE_PATH: "/data/payment.db"
      PAYMENT_FAILURE_RATE: "0"
    volumes:
      - ./data/payment:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  notification:
    build: ./services/notification
    container_name: ecommerce-notification
    ports:
      - "8005:8000"
    environment:
      SERVICE_PORT: "8000"
      DATABASE_PATH: "/data/notification.db"
    volumes:
      - ./data/notification:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  order:
    build: ./services/order
    container_name: ecommerce-order
    ports:
      - "8003:8000"
    environment:
      SERVICE_PORT: "8000"
      DATABASE_PATH: "/data/order.db"
      CATALOG_SERVICE_URL: "http://catalog:8000"
      INVENTORY_SERVICE_URL: "http://inventory:8000"
      PAYMENT_SERVICE_URL: "http://payment:8000"
      NOTIFICATION_SERVICE_URL: "http://notification:8000"
    volumes:
      - ./data/order:/data
    depends_on:
      catalog:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
      notification:
        condition: service_healthy
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  ecommerce-net:
    driver: bridge
